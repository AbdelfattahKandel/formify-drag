
<div class="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950">
  
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 h-[500px] w-[500px] rounded-full bg-gradient-to-br from-blue-400/30 to-indigo-400/30 dark:from-blue-600/20 dark:to-indigo-600/20 blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-40 -left-40 h-[500px] w-[500px] rounded-full bg-gradient-to-tr from-purple-400/30 to-pink-400/30 dark:from-purple-600/20 dark:to-pink-600/20 blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 h-[600px] w-[600px] rounded-full bg-gradient-to-r from-cyan-400/20 to-blue-400/20 dark:from-cyan-600/10 dark:to-blue-600/10 blur-3xl" style="animation: float 12s ease-in-out infinite;"></div>
    
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>
  </div>

  <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-12">
    @if (!started()) {
      <div @fadeSwitch class="w-full max-w-4xl">
        <app-hero (start)="startSetup()" />
      </div>
    } @else {
      <div @fadeSwitch class="w-full max-w-6xl">
        <app-setup-stepper (complete)="completeSetup()" />
      </div>
    }
  </div>

  @if (!started()) {
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-2 text-sm text-slate-500 dark:text-slate-400 pointer-events-none">
      <i class="pi pi-sparkles"></i>
      <span>Quick & Easy Setup</span>
    </div>
  }
</div>
