<section class="flex flex-col items-center justify-center text-center py-20 px-6 select-none" @fadeSlideIn>
  <h1 class="text-6xl md:text-7xl font-black mb-6 tracking-tight">
    <span
      class="bg-gradient-to-r from-slate-900 via-slate-700 to-slate-900 dark:from-white dark:via-slate-600 dark:to-white bg-clip-text text-transparent"
    >
      Welcome to
    </span>
    <br />
    <span class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent animate-gradient">
      Formify
    </span>
  </h1>

  <p class="text-transparent bg-clip-text animate-gradient dark:text-slate-300 text-xl md:text-2xl max-w-2xl mb-4 leading-relaxed font-medium">
    Build smart, flexible, and beautiful forms
  </p>
  <p class="text-slate-500 dark:text-slate-400 text-lg max-w-xl mb-12 leading-relaxed">
    Your way, powered by Angular & modern UI magic <span><i class="pi pi-sparkles"></i></span>
  </p>

  <div class="flex flex-col sm:flex-row gap-4 items-center">
    <p-button
      label="Get Started"
      icon="pi pi-arrow-right"
      iconPos="right"
      styleClass="p-button-lg p-button-rounded bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white shadow-lg shadow-blue-500/20 hover:shadow-blue-500/40 transition-all duration-300"
      [style]="{ 'font-weight': '600' }"
      (onClick)="start.emit()"
    />
  </div>

  <div class="flex flex-wrap items-center justify-center gap-3 mt-16">
    <div
      class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 shadow-sm"
    >
      <i class="pi pi-bolt text-yellow-700"></i>
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Lightning Fast</span>
    </div>

    <div
      class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 shadow-sm"
    >
      <i class="pi pi-palette text-purple-700"></i>
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Fully Customizable</span>
    </div>

    <div
      class="flex items-center gap-2 px-4 py-2 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 shadow-sm"
    >
      <i class="pi pi-shield text-green-700"></i>
      <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Type Safe</span>
    </div>
  </div>
</section>
