<div class="flex gap-2 h-full p-2">
    <!-- Unified Sidebar: Pages + Groups + Controls -->
    <div class="w-[23vw]">
      <app-unified-sidebar
        [groupNames]="currentGroupNames()"
        [selectedGroup]="selectedGroup()"
        [paletteTools]="paletteTools"
        (pageAdd)="onPageAdd()"
        (groupSelect)="onGroupSelect($event)"
        (groupAdd)="onGroupAdd($event)"
        (groupRemove)="onGroupRemove($event)">
      </app-unified-sidebar>
    </div>
    
  
    <!-- Canvas -->
    <div class="flex-1 border border-gray-200 rounded-md">
      <div class="rounded-md shadow-sm p-3 min-h-[90vh]">
        <!-- Compact Header -->
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-gray-200">
          <div class="w-64 p-2 text-sm  rounded" ></div>
          <!-- <input
            pInputText
            type="text"
            class="w-64 p-2 text-sm border rounded"
            placeholder="Form Name"
            [(ngModel)]="title"
            [ngModelOptions]="{ standalone: true }"
          /> -->
          
          <div class="flex gap-1">
            <button pButton icon="pi pi-cog" [disabled]="!selectedField"
              (click)="selectedField && openFieldEditor(selectedField)" 
              class="p-button-sm p-button-text"
              pTooltip="Edit Selected Field" tooltipPosition="bottom">
            </button>
            <p-button icon="pi pi-trash" [disabled]="!selectedField"
              (onClick)="removeSelectedField()" 
              styleClass="p-button-sm p-button-text p-button-danger"
              pTooltip="Remove Selected" tooltipPosition="bottom">
            </p-button>
            <p-button icon="pi pi-code" (onClick)="generateJson()"
              styleClass="p-button-sm p-button-text p-button-success"
              pTooltip="Generate JSON" tooltipPosition="bottom">
            </p-button>
            <p-button icon="pi pi-upload" (onClick)="triggerImportJson()"
              styleClass="p-button-sm p-button-text"
              pTooltip="Import JSON" tooltipPosition="bottom">
            </p-button>
            <input #importJsonInput type="file" accept="application/json" class="hidden" (change)="onImportJsonSelected($event)" />
          </div>
        </div>

        <!-- Form Group Assignment -->
        <app-form-group-assign
          [groupNames]="currentGroupNames()"
          [selectedGroup]="selectedGroup()"
          (groupChange)="onGroupSelect($event)"
          (assignToGroup)="onAssignFormToGroup()">
        </app-form-group-assign>
  
        <div cdkDropList id="canvas" [cdkDropListData]="droppedTools" [cdkDropListConnectedTo]="['palette']"
          (cdkDropListDropped)="drop($event)" class="canvas-container">
  
          @if (droppedTools.length === 0) {
          <div class="col-span-4 flex flex-col items-center justify-center text-gray-400 py-12">
            <i class="pi pi-arrow-left text-3xl mb-3"></i>
            <p class="text-base">Drag and drop elements here</p>
            <p class="text-xs">or click on any element in the left panel</p>
          </div>
          }
  
          @for (tool of droppedTools; track tool.formControl || tool.id || $index) {
          <div cdkDrag [cdkDragData]="tool" (click)="onFieldSelected(tool)" class="field-container"
               [style.grid-column]="'span ' + (tool.fieldStyle?.columns || 1)"
               [style.width]="tool.fieldStyle?.width || '100%'">
            <!-- Field actions removed for minimal UI -->
            
            <form [formGroup]="formGroup" class="w-full">
              <app-rerender 
                [field]="tool" 
                [isEditMode]="isEditMode" 
                [isRowSelected]="selectedField?.id === tool.id"
                [formGroup]="formGroup"
                (editRequested)="openFieldEditor(tool)">
              </app-rerender>
            </form>

          </div>}
        </div>
      </div>
    </div>
  </div>

  <!-- Field Editor Modal -->
  @if (showFieldEditor && selectedField) {
    <app-field-editor-mode
      [field]="selectedField!"
      [(visible)]="showFieldEditor"
      (save)="onFieldSaved($event)"
      (cancel)="showFieldEditor = false"
    ></app-field-editor-mode>
  }
