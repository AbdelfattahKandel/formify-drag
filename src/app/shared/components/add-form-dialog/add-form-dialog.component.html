<p-dialog
  header="Add New Form"
  [(visible)]="visible"
  (onHide)="onHide()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '400px' }"
>
  <div class="p-fluid">
    <div class="field">
      <label for="formName" class="block text-900 font-medium mb-2">Form Name</label>
      <input 
        id="formName" 
        type="text" 
        pInputText 
        [(ngModel)]="formName" 
        class="w-full" 
        placeholder="Enter form name (e.g., user, admin)" 
        (keyup.enter)="onAdd()"
        autofocus
      />
      <small class="text-500">Choose a descriptive name for your form</small>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      type="button"
      label="Cancel"
      icon="pi pi-times"
      class="p-button-text"
      (click)="onCancel()"
    ></button>
    <button
      pButton
      type="button"
      label="Add Form"
      icon="pi pi-plus"
      (click)="onAdd()"
      [disabled]="!formName.trim()"
    ></button>
  </ng-template>
</p-dialog>
