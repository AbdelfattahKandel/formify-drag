<div class="image-uploader-container" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
    <!-- Add Image Button at the top -->
    <div class="add-button mb-4">
      <p-button 
        icon="pi pi-plus" 
        (onClick)="addImage(); $event.stopPropagation()"
        label="Add Image"
        styleClass="p-button-outlined">
      </p-button>
    </div>
  
    <!-- Image Cards -->
    <div class="image-cards-container">
      @if (images) {
        @for (ctrl of images.controls; let i = $index; track i) {
          <div class="image-card border-2 border-gray-400 ">
            <!-- Image Preview -->
            <div class="image-preview">
              @if (localUrls[i]) {
                <p-image 
                  [src]="localUrls[i]" 
                  alt="Preview" 
                  styleClass="preview-img">
                </p-image>
              } @else {
                <div class="empty-preview">
                  <i class="pi pi-image" style="font-size: 2rem"></i>
                  <span>No Image</span>
                </div>
              }
            </div>
            
            <!-- Card Footer with Actions -->
            <div class="card-footer">
              <input 
                type="file" 
                accept="image/*" 
                #fileInput 
                (change)="onFileSelected($event, i)" 
                class="file-input" />
              
              <div class="flex gap-2">
                <p-button 
                  icon="pi pi-upload" 
                  (onClick)="fileInput.click(); $event.stopPropagation()"
                  label="Upload"
                  styleClass="p-button-outlined p-button-sm flex-1"
                  [style]="{'min-width': '100px'}">
                </p-button>
  
                <p-button 
                  icon="pi pi-trash" 
                  (onClick)="removeImage(i); $event.stopPropagation()"
                  styleClass="p-button-outlined p-button-danger p-button-sm"
                  pTooltip="Delete"
                  tooltipPosition="top">
                </p-button>
              </div>
            </div>
          </div>
        }
      }
    </div>
  </div>
