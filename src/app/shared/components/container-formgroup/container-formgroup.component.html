<div class="space-y-3" [formGroupName]="groupKey()">
  @if (groupLabel()) {
    <h4 class="text-base font-semibold">{{ groupLabel() }}</h4>
  }

  <div
    cdkDropList
    [id]="'group-' + groupKey()"
    [cdkDropListData]="children()"
    [cdkDropListConnectedTo]="['palette', 'canvas']"
    (cdkDropListDropped)="onDrop($event)"
    class="rounded border border-gray-300 p-3"
  >
    <div class="grid grid-cols-12 gap-4">
      @for (child of children(); track child.id ?? child.key ?? $index) {
        @if (child.kind === 'group') {
          <div class="col-span-12">
            <app-container-formgroup [group]="child"></app-container-formgroup>
          </div>
        } @else {
          <div class="col-span-12">
            <app-rerender [field]="child"></app-rerender>
          </div>
        }
      }
    </div>
  </div>
</div>
